name: API Tests (Practice 5)

on:
  workflow_dispatch:
  push:
    branches:
      - 'practic-5*'
      - 'practice-5*'
    paths-ignore:
      - 'docs/**'
      - 'tz/**'
      - '**/*.md'
      - '**/*.puml'
      - '**/*.png'

concurrency:
  group: api-tests-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create .env file
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start all services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start"
          for i in {1..60}; do
            not_ready=$(docker compose ps --format '{{.Health}}' | grep -E 'starting|unhealthy' | wc -l | tr -d ' ')
            if [ "$not_ready" == "0" ]; then
              break
            fi
            echo "Waiting ($i/60)"
            sleep 5
          done
          sleep 15

      - name: Run API tests
        run: mvn -f services/pom.xml -pl api-tests -am test -DskipApiTests=false

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose down -v
